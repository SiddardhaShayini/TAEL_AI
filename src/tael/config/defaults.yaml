model:
  backend: "ollama"
  endpoint: "http://127.0.0.1:11434"
  model_name: "granite-code:3b"
  context_window: 4096
  max_output_tokens: 1024
  temperature: 0.2
  timeout_seconds: 90

resource:
  profile: "auto"
  max_ram_percent: 85.0
  min_free_ram_gb: 1.5
  max_cpu_threads: 4
  sampling_interval_seconds: 2.0

policy:
  require_approval_write: true
  require_approval_execute: true
  require_approval_internet: true
  require_approval_app_launch: true
  allow_internet: false
  audit_logging: true

memory:
  enabled: true
  token_budget: 1000
  fts_enabled: true
  max_results: 10

server:
  host: "127.0.0.1"
  port: 7860
  request_timeout_seconds: 120

# External Model Context Protocol (MCP) servers
# Servers configured here will be automatically started and attached to the tool registry.
mcp_servers: {}
