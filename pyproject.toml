[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tael"
version = "3.0.0a1"
description = "TAEL V3: Task-Adaptive Efficient Language AI - Local-first AI creation and research assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.8",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[project.scripts]
tael = "tael.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tael"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
