name: TAEL V3 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install TAEL V3 & Dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Test Suite
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            .venv/Scripts/pytest -v
          else
            .venv/bin/pytest -v
          fi

      - name: Run System Diagnostics (Doctor)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            .venv/Scripts/tael doctor
          else
            .venv/bin/tael doctor
          fi

      - name: Run Versioned Benchmark Evaluation Suite
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            .venv/Scripts/tael eval --export BENCHMARK_REPORT.md
          else
            .venv/bin/tael eval --export BENCHMARK_REPORT.md
          fi
